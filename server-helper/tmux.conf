# Remote Agent tmux config — used only for app-created sessions
# (tmux -f ~/.remote-agent/tmux.conf new-session ...). The GUI provides all
# chrome, so the tmux status bar stays off.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -sg escape-time 10
set -g focus-events on
set -g status off
set -g set-titles off

# Clipboard: carry a copy made on the server back to the client's own OS
# clipboard over the SSH connection, as OSC 52 (the GUI decodes it, osc52.ts).
# "on" rather than the default "external" so that applications inside tmux can
# copy too, not just tmux's own copy-mode selections — that is how an agent CLI
# offers "copy this".
set -gq set-clipboard on

# tmux only emits OSC 52 when terminfo advertises Ms for the outer terminal.
# The app requests its PTY with TERM=xterm-256color, whose entry carries Ms only
# on newer ncurses, so state it outright.
set -ga terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\7'

# Agent CLIs wrap OSC 52 in a DCS passthrough (\ePtmux;...\e\\) to punch out of
# tmux; tmux 3.3+ discards those unless this is on. -q keeps older tmux, which
# has no such option, from reporting a config error.
set -gq allow-passthrough on
