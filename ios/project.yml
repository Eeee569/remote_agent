# Xcode project spec for the iPhone app. Generate the project with ./setup.sh
# (which runs XcodeGen); RemoteAgent.xcodeproj itself is not committed.
name: RemoteAgent
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  RemoteAgentCore:
    path: RemoteAgentCore
targets:
  RemoteAgent:
    type: application
    platform: iOS
    sources:
      - path: RemoteAgent
        excludes:
          - web
      # a folder reference, so the page ships as web/index.html in the bundle
      - path: RemoteAgent/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: RemoteAgentCore
        product: RemoteAgentCore
    info:
      path: RemoteAgent/Info.plist
      properties:
        CFBundleDisplayName: Remote Agent
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        NSLocalNetworkUsageDescription: Remote Agent connects over SSH to servers on your local network.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # must be unique per Apple ID; setup.sh derives one from your user name
        PRODUCT_BUNDLE_IDENTIFIER: ${RA_BUNDLE_ID}
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
